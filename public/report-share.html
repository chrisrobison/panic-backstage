<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settlement Report — Panic Backstage</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100dvh;
    }
    .page-toolbar {
      max-width: 8.5in;
      margin: 0 auto;
      padding: 16px 0 0;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .page-toolbar button {
      font: inherit;
      padding: 8px 14px;
      border: 1px solid #888;
      background: #fff;
      border-radius: 4px;
      cursor: pointer;
    }
    .page-toolbar button.primary { background: #111; color: #fff; border-color: #111; }

    .loading, .status-screen { text-align: center; padding: 80px 24px; color: #555; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #d0cfc8;
      border-top-color: #1a56c4;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-icon { font-size: 3rem; margin-bottom: 16px; }
    .status-screen h2 { font-size: 1.4rem; margin-bottom: 10px; }
    .status-screen p { color: #555; font-size: .95rem; line-height: 1.6; }

    @media print {
      .page-toolbar { display: none !important; }
      body { background: #fff; }
    }
  </style>
</head>
<body>

<!-- Loading state -->
<div id="loadingCard" class="loading">
  <div class="spinner"></div>
  Loading settlement report…
</div>

<!-- Error state -->
<div id="errorCard" class="status-screen" style="display:none">
  <div class="status-icon">&#9888;&#65039;</div>
  <h2>Link Unavailable</h2>
  <p id="errorMsg">This link has expired or is no longer valid. Please contact us for a new link.</p>
</div>

<!-- Report content (hidden until loaded) -->
<div id="reportRoot" style="display:none"></div>

<script type="module">
  import { renderPrintBody, PRINT_CSS, printFooter } from './assets/print.js';

  function show(id) { document.getElementById(id).style.display = ''; }
  function hide(id) { document.getElementById(id).style.display = 'none'; }

  const params = new URLSearchParams(window.location.search);
  const token  = params.get('token') || '';

  function fail(message) {
    document.getElementById('errorMsg').textContent = message;
    hide('loadingCard');
    show('errorCard');
  }

  if (!token) {
    fail('No link token found in the URL. Please use the link provided by the venue.');
  } else {
    const apiBase = (function () {
      const base = window.location.pathname.replace(/\/[^/]*$/, '');
      return (base === '' ? '' : base) + '/api';
    }());

    fetch(apiBase + '/portal/view?token=' + encodeURIComponent(token))
      .then((res) => {
        if (!res.ok) return res.json().then((d) => { throw new Error(d.error || 'Request failed'); });
        return res.json();
      })
      .then((data) => {
        if (data.kind !== 'settlement_report') {
          throw new Error('This link does not point to a settlement report.');
        }

        document.title = `${data.event.title} — Settlement Report`;

        // Inject the same styles the in-app "Print" popup uses (openPrintWindow
        // in print.js) so this standalone page renders byte-identical markup —
        // one source of truth for what a Settlement Statement looks like.
        const styleEl = document.createElement('style');
        styleEl.textContent = PRINT_CSS;
        document.head.appendChild(styleEl);

        const root = document.getElementById('reportRoot');
        root.innerHTML = `
          <div class="page-toolbar">
            <button type="button" class="primary" id="printBtn">Print</button>
          </div>
          <article class="sheet">
            ${renderPrintBody('settlement', data)}
            ${printFooter(data)}
          </article>`;
        document.getElementById('printBtn').addEventListener('click', () => window.print());

        hide('loadingCard');
        show('reportRoot');
      })
      .catch((err) => {
        fail((err && err.message) || 'Unable to load this report. The link may have expired.');
      });
  }
</script>
</body>
</html>
