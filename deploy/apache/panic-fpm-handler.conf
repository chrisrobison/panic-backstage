# Routes PHP to the cdr-owned `panic` FPM pool instead of the shared
# www-data `www` pool.
#
# Install to: /etc/apache2/panic-fpm-handler.conf
#
# Include this INSIDE each VirtualHost block that serves the Backstage
# codebase (see docs/php-fpm-cdr-pool.md for the exact list):
#
#     Include /etc/apache2/panic-fpm-handler.conf
#
# Keeping the handler in one shared file means rollback is a single edit
# here (comment out the SetHandler) plus an apache reload — no need to
# touch five vhosts again.
#
# This overrides the global handler from conf-enabled/php8.2-fpm.conf,
# which points every vhost on the box at /run/php/php8.2-fpm.sock.

<FilesMatch ".+\.ph(?:ar|p|tml)$">
    SetHandler "proxy:unix:/run/php/php8.2-panic.sock|fcgi://localhost"
</FilesMatch>
