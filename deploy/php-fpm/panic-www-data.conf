; Dedicated PHP-FPM pool for panicbooking.com/backstage, sized for the
; realtime SSE stream (docs/realtime-data.md), running as `www-data` — the
; same user the shared `www` pool already uses. No ownership change, no
; new file-access exposure. This ONLY isolates Backstage's realtime worker
; consumption from the ~60 other vhosts on this host's shared `www` pool.
;
; Install to: /etc/php/8.2/fpm/pool.d/panic-www.conf
; See docs/php-fpm-realtime-pool.md for the apply/verify/rollback procedure.
;
; NOT the same thing as deploy/php-fpm/panic.conf (docs/php-fpm-cdr-pool.md)
; — that's a separate, larger decision (runs as `cdr`, fixes the AI-CLI
; credential-permission bug, trades away SSH-key isolation). Install only
; one of the two pool files, not both — they'd fight over the same socket
; path.

[panic]

; ── Worker identity ──────────────────────────────────────────────────────
; Deliberately www-data — identical trust boundary to every other site on
; this host today. This pool exists to isolate CAPACITY, not identity.
user  = www-data
group = www-data

; ── Socket ───────────────────────────────────────────────────────────────
listen       = /run/php/php8.2-panic.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; ── Process manager ──────────────────────────────────────────────────────
; The shared `www` pool serves ~60 other vhosts with pm.max_children = 5.
; An SSE connection (GET /api/realtime/stream, opt-in via REALTIME_ENABLED)
; pins one worker for up to REALTIME_STREAM_TTL_SECONDS (~55s) PER OPEN
; BROWSER TAB, and reconnects immediately when that ends — so "concurrent
; open tabs" is the sizing input, not "requests/second". Without a
; dedicated pool, a handful of open Backstage tabs exhausts the *shared*
; 5-worker pool and takes every other site on the host down with it — see
; docs/realtime-data.md's "Production configuration" section.
;
; `ondemand` (not `dynamic`): workers are forked purely on request and
; reaped after pm.process_idle_timeout of inactivity, so this headroom
; costs nothing while realtime is off or quiet.
;
; pm.max_children = 20 sizes for roughly a dozen-plus concurrently open
; realtime tabs plus ordinary API traffic, at PHP's 128M memory_limit per
; worker (128M * 20 = 2.56G worst case) — check `free -h` against that
; before raising it further, and re-derive for actual expected concurrent
; staff before enabling realtime broadly.
pm                      = ondemand
pm.max_children         = 20
pm.process_idle_timeout = 10s

; AI flyer/assistant calls shell out to codex/claude and can run 60-90s.
; The endpoint already raises its own PHP time limit; keep FPM from
; killing the request out from under it. Also covers the realtime stream
; itself (~55s default TTL) with headroom.
request_terminate_timeout = 300

; No session.save_path override here (unlike deploy/php-fpm/panic.conf) —
; this app doesn't use native PHP sessions ($_SESSION), only its own
; bearer/cookie auth (see SessionCookies), so the default shared
; /var/lib/php/sessions is fine as-is.
