; Dedicated PHP-FPM pool running as `cdr` for the Panic Backstage domains.
;
; Install to: /etc/php/8.2/fpm/pool.d/panic.conf
; See docs/php-fpm-cdr-pool.md for the full rationale and apply procedure.
;
; Why this exists: the app shells out to the `codex` and `claude` CLIs, which
; authenticate from credentials under /home/cdr (~/.codex/auth.json,
; ~/.claude/.credentials.json). Both CLIs rewrite those files on token
; refresh and reset them to mode 0600, which silently breaks a web process
; running as www-data. Running the pool as `cdr` removes that whole class of
; bug, and aligns web-created files with the cron jobs (which already run as
; cdr) so ownership stays consistent.

[panic]

; ── Worker identity ──────────────────────────────────────────────────────
; The workers run as cdr; this is the entire point of the pool.
user  = cdr
group = cdr

; ── Socket ───────────────────────────────────────────────────────────────
; IMPORTANT: the socket is owned by www-data because *Apache* connects to
; it, and Apache runs as www-data. Only the workers behind it run as cdr.
; Setting these to cdr is the classic mistake here and yields 503s.
listen       = /run/php/php8.2-panic.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; ── Process manager ──────────────────────────────────────────────────────
; Sized independently of the shared `www` pool, which serves ~200 other
; vhosts with pm.max_children = 5. Backstage gets its own headroom here.
;
; `ondemand` rather than `dynamic`: workers are forked purely on request and
; reaped after pm.process_idle_timeout of inactivity, instead of a
; dynamic pool's standing pm.start_servers/min_spare_servers baseline. That
; matters specifically because of docs/realtime-data.md's realtime feature
; (src/Realtime.php, GET /api/realtime/stream, opt-in via REALTIME_ENABLED):
; an open SSE connection pins one worker for up to
; REALTIME_STREAM_TTL_SECONDS (~55s default) *per open browser tab*, so
; "concurrent open tabs across signed-in staff" is the real sizing input,
; not "requests per second". `ondemand` lets pm.max_children sit high enough
; to absorb a burst of simultaneously open tabs without that translating
; into standing idle worker memory the rest of the time realtime is quiet or
; disabled.
;
; pm.max_children = 20 sizes for roughly a dozen-plus concurrently open
; realtime tabs (each pins one worker for most of its lifetime) with
; headroom left for ordinary short-lived API traffic on top — comfortable
; against this host's available memory at PHP's 128M memory_limit per
; worker (128M * 20 = 2.56G worst case, well under what `free -h` shows
; available alongside the separate `www` pool). Re-check both numbers
; (expected concurrent tabs, host memory) before raising this further, and
; before setting REALTIME_ENABLED=true on this pool in the first place —
; see docs/realtime-data.md's "Production configuration" section.
pm                      = ondemand
pm.max_children         = 20
pm.process_idle_timeout = 10s

; AI flyer/assistant calls shell out to codex and can run 60-90s. The
; endpoint already raises its own PHP time limit; keep FPM from killing the
; request out from under it.
request_terminate_timeout = 300

; ── Sessions ─────────────────────────────────────────────────────────────
; The shared /var/lib/php/sessions is mode 1733 (write+execute for all, no
; read), so a cdr-owned worker can create and read its *own* session files
; there without extra setup. Given its own directory anyway so the super
; admin UI's sessions are not interleaved with other sites' files.
php_admin_value[session.save_path] = /home/cdr/domains/panicbooking.com/www/backstage/storage/sessions

; ── Optional hardening ───────────────────────────────────────────────────
; Uncomment to restrict PHP's own file functions to the paths this app
; actually needs. Read docs/php-fpm-cdr-pool.md first — this is a PARTIAL
; mitigation: open_basedir constrains PHP file operations only, and does
; NOT constrain the codex/claude CLIs the app exec()s.
;
;php_admin_value[open_basedir] = /home/cdr/domains/panicbooking.com/www:/home/cdr/domains/panicbackstage.com:/home/cdr/.codex:/home/cdr/.claude:/tmp:/usr/share/php
